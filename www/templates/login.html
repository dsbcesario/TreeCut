<ion-view title="" id="page5">

  <ion-content padding="true" scroll="true" class="has-header">
    <form id="login-form1" class="list" ng-submit="entrar()">
      <div class="spacer" style="width: 300px; height: 50px;"></div>
      <div>
        <img src="img/logo.png" style="display: block; width: 80%; height: auto; margin-left: auto; margin-right: auto;">
      </div>
      <div class="spacer" style="width: 300px; height: 40px;"></div>

      <ion-list id="login-list1">
        <label class="item item-input" id="login-input1">
          <input placeholder="E-mail" required="true" ng-model="user.email" type="email">
        </label>
        <label class="item item-input" id="login-input2">
          <input placeholder="Senha" required="true" ng-model="user.password" type="password">
        </label>
      </ion-list>

      <div class="spacer" style="width: 300px; height: 20px;"></div>

      <button id="login-button1" class="button button-balanced button-block" type="submit">
        Entrar
      </button>

      <div class="spacer" style="height: 15px;"></div>

      <a ui-sref="cadastro" class="button button-clear button-positive button-block">
        Não tem conta? Cadastre-se
      </a>
    </form>
  </ion-content>
</ion-view>
