<ion-view id="page1">
  <ion-side-menus>

    <!-- Conteúdo principal -->
    <ion-side-menu-content>
      <ion-nav-bar class="bar-balanced">
        <!-- REMOVA esta linha: <ion-nav-back-button></ion-nav-back-button> -->
        <ion-nav-title>
          <img src="img/logo.png" class="nav-logo" alt="TreeCut">
        </ion-nav-title>
      </ion-nav-bar>
      <ion-nav-view name="menuContent"></ion-nav-view>
    </ion-side-menu-content>

    <!-- Menu lateral esquerdo -->
    <ion-side-menu side="left">
      <ion-header-bar class="bar-stable">
        <h1 class="title">TreeCut</h1>
      </ion-header-bar>
      <ion-content>
        <ion-list>
          <ion-item class="item-icon-left" menu-close ng-click="abrirPerfil()">
            <i class="icon ion-person"></i> Editar perfil
          </ion-item>
          <ion-item class="item-icon-left" menu-close ng-click="abrirSolicitacao()">
            <i class="icon ion-compose"></i> Solicitar poda
          </ion-item>
          <ion-item class="item-icon-left" menu-close ng-click="abrirDenuncia()">
            <i class="icon ion-clipboard"></i> Solicitar denúncia
          </ion-item>
          <ion-item class="item-icon-left" menu-close ng-click="abrirSobreNos()">
            <i class="icon ion-person-stalker"></i> Sobre nós
          </ion-item>
          <ion-item class="item-icon-left" menu-close ng-click="logout()">
            <i class="icon ion-log-out"></i> Logout
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-side-menu>

  </ion-side-menus>
</ion-view>
