<ion-view title="Cadastro" id="page6">

  <ion-content padding="true" scroll="true" class="has-header">
    <form name="formCadastro" class="list" ng-submit="Cadastrar(username, senha)">

      <div class="item item-divider">Dados pessoais</div>

      <label class="item item-input">
        <span class="input-label">Nome completo</span>
        <input type="text" placeholder="Seu nome" required="true" ng-model="username">
      </label>

      <label class="item item-input">
        <span class="input-label">CPF</span>
        <input type="text" placeholder="000.000.000-00" required="true" ng-model="user.cpf">
      </label>

      <label class="item item-input">
        <span class="input-label">Endereço</span>
        <input type="text" placeholder="Rua, avenida..." required="true" ng-model="user.endereco">
      </label>

      <ion-grid>
        <ion-row>
          <ion-col width="40">
            <label class="item item-input">
              <span class="input-label">Nº</span>
              <input type="text" placeholder="123" required="true" ng-model="user.numero">
            </label>
          </ion-col>
          <ion-col width="60">
            <label class="item item-input">
              <span class="input-label">Bairro</span>
              <input type="text" placeholder="Bairro" required="true" ng-model="user.bairro">
            </label>
          </ion-col>
        </ion-row>
      </ion-grid>

      <ion-grid>
        <ion-row>
          <ion-col width="60">
            <label class="item item-input">
              <span class="input-label">Cidade</span>
              <select ng-model="user.cidade">
                <option value="{{array.cidade}}" ng-repeat="array in lista">{{array.cidade}}</option>
              </select>
            </label>
          </ion-col>
          <ion-col width="40">
            <label class="item item-input">
              <span class="input-label">CEP</span>
              <input type="text" placeholder="00000-000" required="true" ng-model="user.cep">
            </label>
          </ion-col>
        </ion-row>
      </ion-grid>

      <label class="item item-input">
        <span class="input-label">Telefone</span>
        <input type="tel" placeholder="(00) 00000-0000" required="true" ng-model="user.telefone">
      </label>

      <label class="item item-input item-select">
        <div class="input-label">Tipo de cadastro</div>
        <select ng-model="tipo.status">
          <option value="0" selected>Solicitante</option>
          <option value="1">Administrador</option>
        </select>
      </label>

      <div class="item item-divider">Acesso</div>

      <label class="item item-input">
        <span class="input-label">E-mail</span>
        <input type="email" placeholder="seu@email.com" required="true" ng-model="user.email">
      </label>

      <label class="item item-input">
        <span class="input-label">Senha</span>
        <input type="password" id="cadastro-input5" required="true" ng-model="senha1">
      </label>

      <label class="item item-input">
        <span class="input-label">Confirmar senha</span>
        <input type="password" required="true" ng-model="senha">
      </label>

      <div class="spacer" style="height: 1.5rem;"></div>

      <button id="cadastro-button4" class="button button-balanced button-block" type="submit" ng-disabled="formCadastro.$invalid">
        Criar
      </button>
    </form>
  </ion-content>
</ion-view>
